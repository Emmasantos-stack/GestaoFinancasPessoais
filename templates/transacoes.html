<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <title>Gerir Transações</title>
    <link rel="stylesheet" href="css/style.css">
</head>

<body class="page">
    <header class="header">
        <h1 class="header__title">Gerir Transações</h1>
    </header>

    <main class="main">

        <!-- FORMULARIO -->
        <section class="section section--form">
            <h2 class="section__title">Adicionar Transação</h2>

            <form id="formTransacao" class="form">

                <div class="form__group">
                    <label class="form__label">Descrição</label>
                    <input type="text" id="descricao" class="form__input" required>
                </div>

                <div class="form__group">
                    <label class="form__label">Valor (€)</label>
                    <input type="number" id="valor" class="form__input" step="0.01" min="0.01" required>
                </div>

                <div class="form__group">
                    <label class="form__label">Data</label>
                    <input type="date" id="data" class="form__input" required>
                </div>

                <div class="form__group">
                    <label class="form__label">Categoria</label>
                    <select id="categoria" class="form__input" required></select>
                </div>

                <button class="button" type="submit">Adicionar</button>
            </form>

            <p id="transacaoMensagem" class="form__message"></p>
        </section>


        <!-- TABELA -->
        <section class="section section--table">
            <h2 class="section__title">Lista de Transações</h2>

            <table class="table">
                <thead class="table__head">
                    <tr class="table__row">
                        <th class="table__cell">ID</th>
                        <th class="table__cell">Descrição</th>
                        <th class="table__cell">Valor (€)</th>
                        <th class="table__cell">Data</th>
                        <th class="table__cell">Categoria</th>
                        <th class="table__cell">Ações</th>
                    </tr>
                </thead>

                <tbody id="tabelaTransacoes" class="table__body"></tbody>
            </table>
        </section>

    </main>

    <script src="js/transacoes.js"></script>
</body>
</html>
