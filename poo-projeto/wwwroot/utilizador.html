<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <title>Gerir Utilizadores</title>
    <link rel="stylesheet" href="css/style.css">
</head>

<body class="page">

    <header class="header">
        <h1 class="header__title">Gerir Utilizadores</h1>
        <button class="button button--logout" onclick="logout()">
    Logout
</button>

    </header>

    <main class="main">

        <!-- FORMULARIO -->
        <section class="section section--form">
            <h2 class="section__title">Adicionar Utilizador</h2>

            <form id="formUtilizador" class="form">

                <div class="form__group">
                    <label class="form__label">Nome</label>
                    <input type="text" id="nome" class="form__input" required>
                </div>

                <div class="form__group">
                    <label class="form__label">Email</label>
                    <input type="email" id="email" class="form__input" required>
                </div>

                <div class="form__group">
                    <label class="form__label">Password</label>
                    <input type="password" id="password" class="form__input" required minlength="4">
                </div>

                <div class="form__group">
                    <label class="form__label">Perfil</label>
                    <select id="perfil" class="form__input">
                        <option value="admin">Administrador</option>
                        <option value="user">Utilizador</option>
                    </select>
                </div>

                <button class="button" type="submit">Criar Utilizador</button>
            </form>

            <p id="utilizadorMensagem" class="form__message"></p>
        </section>

        <!-- TABELA -->
        <section class="section section--table">
            <h2 class="section__title">Lista de Utilizadores</h2>

            <table class="table">
                <thead class="table__head">
                    <tr class="table__row">
                        <th class="table__cell">ID</th>
                        <th class="table__cell">Nome</th>
                        <th class="table__cell">Email</th>
                        <th class="table__cell">Perfil</th>
                        <th class="table__cell">Ações</th>
                    </tr>
                </thead>

                <tbody id="tabelaUtilizador" class="table__body"></tbody>
            </table>
        </section>

    </main>
<script src="session.js"></script>

    <!-- Logout -->
    <script src="logout.js"></script>
    <script src="utilizador.js"></script>
</body>
</html>
