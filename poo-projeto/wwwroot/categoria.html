<!DOCTYPE html>
<html lang="pt">
<head>
    <!-- Definição do conjunto de caracteres -->
    <meta charset="UTF-8">

    <!-- Configuração para layout responsivo em dispositivos móveis -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- Título apresentado no separador do navegador -->
    <title>Gerir Categoria</title>

    <!-- Ligação ao ficheiro de estilos global -->
    <link rel="stylesheet" href="css/style.css">
</head>

<body class="page page--Categoria">

    <!-- =====================================================
         HEADER
         Apresenta o título da página e ligação de retorno
         ===================================================== -->
    <header class="header">
        <h1 class="header__title">Gerir Categoria</h1>

        <!-- Link para regressar à página principal -->
        <a href="index.html" class="header__back">
            ← Voltar ao Início
        </a>
    </header>

    <!-- =====================================================
         CONTEÚDO PRINCIPAL
         ===================================================== -->
    <main class="main">

        <!-- -------------------------------------------------
             FORMULÁRIO DE CRIAÇÃO DE CATEGORIA
             ------------------------------------------------- -->
        <section class="section section--form">
            <h2 class="section__title">Criar Nova Categoria</h2>

            <!-- Formulário controlado por JavaScript -->
            <form id="formCategoria" class="form form--categoria">

                <!-- Campo para introdução do nome -->
                <div class="form__group">
                    <label for="nomeCategoria" class="form__label">
                        Nome:
                    </label>

                    <input
                        type="text"
                        id="nomeCategoria"
                        class="form__input"
                        required
                    >
                </div>

                <!-- Botão de submissão -->
                <button type="submit" class="button button--primary">
                    Adicionar
                </button>
            </form>

            <!-- Zona para mensagens de erro ou sucesso -->
            <p id="categoriaMensagem" class="message"></p>
        </section>

        <!-- -------------------------------------------------
             LISTAGEM DE CATEGORIAS EXISTENTES
             ------------------------------------------------- -->
        <section class="section section--lista">
            <h2 class="section__title">Categorias Existentes</h2>

            <!-- Tabela de categorias -->
            <table class="table table--Categoria">

                <!-- Cabeçalho da tabela -->
                <thead class="table__head">
                    <tr class="table__row">
                        <th class="table__header">ID</th>
                        <th class="table__header">Nome</th>
                        <th class="table__header">Ações</th>
                    </tr>
                </thead>

                <!-- Corpo preenchido dinamicamente -->
                <tbody id="tabelaCategoria" class="table__body">
                    <!-- Conteúdo gerado via JavaScript -->
                </tbody>
            </table>
        </section>

    </main>

    <!-- =====================================================
         RODAPÉ
         ===================================================== -->
    <footer class="footer">
        <p class="footer__text">
            Projeto POO — Gestão de Finanças
        </p>
    </footer>

    <!-- Gestão de sessão -->
    <script src="session.js"></script>

    <!-- Logout -->
    <script src="logout.js"></script>

    <!-- Lógica da página de categorias -->
    <script src="categoria.js"></script>
</body>
</html>
