<!DOCTYPE html>
<html lang="pt">

    <title>Gestão de Finanças Pessoais</title>

    <!-- CSS principal -->
    <link rel="stylesheet" href="css/style.css">
</head>

        <!-- BOTÃO LOGOUT -->

    <!-- ================= MENU DE NAVEGAÇÃO ================= -->
    <nav class="nav">
