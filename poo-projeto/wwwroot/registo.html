<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Criar Conta — Gestão de Finanças</title>
    <link rel="stylesheet" href="css/style.css">
</head>

<body class="page page--registo">

    <main class="main main--center">

        <section class="card card--registo">
            <h1 class="card__title">Criar Conta</h1>

            <form id="formRegisto" class="form">

                <div class="form__group">
                    <label class="form__label">Nome</label>
                    <input type="text" id="nome" class="form__input" required>
                </div>

                <div class="form__group">
                    <label class="form__label">Email</label>
                    <input type="email" id="email" class="form__input" required>
                </div>

                <div class="form__group">
                    <label class="form__label">Password</label>
                    <input type="password" id="password" class="form__input" required minlength="4">
                </div>

                <!-- Perfil fixo como Utilizador -->
                <input type="hidden" id="perfil" value="Utilizador">

                <button class="button button--primary" type="submit">
                    Criar Conta
                </button>
            </form>

            <p id="registoMensagem" class="message"></p>

            <p class="card__note">
                Já tem conta?
                <a href="login.html">Entrar</a>
            </p>
        </section>

    </main>

    <script src="registo.js"></script>
</body>
</html>
